name: Add a company
description: Request a new company entry. The agent will open a PR.
title: "Add: <company name>"
labels: ["jules", "add-company"]
body:
  - type: input
    id: name
    attributes:
      label: Company name
      placeholder: Anthropic
    validations:
      required: true

  - type: input
    id: careers_url
    attributes:
      label: Careers URL
      description: Public careers or jobs page.
      placeholder: https://www.anthropic.com/careers
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Primary domain
      placeholder: anthropic.com
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - AI and Data
        - Developer Infrastructure
        - Fintech
        - Consumer and Marketplace
        - Healthcare and Biotech
        - Industrials and Climate
        - B2B Enterprise
        - Open Source and Platform
    validations:
      required: true

  - type: input
    id: ats
    attributes:
      label: ATS slug (optional)
      description: "e.g. greenhouse:anthropic, lever:stripe, workday:<host>/<site>. If unknown, leave blank — the agent will identify it from the careers page source, or fall back to custom:<slug> if no real ATS is identifiable. The schema requires at least one ATS entry."

  - type: input
    id: north_america_opening
    attributes:
      label: North America opening
      description: Link to, or title/location of, a current opening in the United States, Canada, Mexico, or a remote role not explicitly limited to another region.
      placeholder: "Software Engineer - Remote"
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Source URLs
      description: One per line. At least one required.
      placeholder: |
        https://www.anthropic.com/careers
        https://news.ycombinator.com/...
    validations:
      required: true

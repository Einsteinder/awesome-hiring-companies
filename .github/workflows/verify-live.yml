name: Verify live

on:
  schedule:
    # Daily at 09:00 UTC. Adjust freely; rate-limit risk is low.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      fail_on_warn:
        description: "Exit non-zero on warn as well as fail"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run live verification
        id: verify
        shell: bash {0}
        run: |
          set +e
          python scripts/verify_live.py \
            ${{ inputs.fail_on_warn == 'true' && '--fail-on-warn' || '' }} \
            --format text > verify_report.txt
          code=$?
          cat verify_report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify_report.txt

      - name: Open or update tracking issue on failure
        if: steps.verify.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('verify_report.txt', 'utf8');
            const title = 'Live verification: broken entries';
            const body = [
              'Automated report from `.github/workflows/verify-live.yml`.',
              '',
              'Run: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              report.slice(0, 60000),
              '```',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'verify-live',
              per_page: 5,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['verify-live'],
              });
            }

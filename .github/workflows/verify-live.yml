name: Verify live

on:
  schedule:
    # Daily at 09:00 UTC. Adjust freely; rate-limit risk is low.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      fail_on_warn:
        description: "Exit non-zero on warn as well as fail"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run live verification
        id: verify
        shell: bash {0}
        run: |
          set +e
          python scripts/verify_live.py \
            ${{ inputs.fail_on_warn == 'true' && '--fail-on-warn' || '' }} \
            --format text > verify_report.txt
          code=$?
          cat verify_report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify_report.txt

      - name: Open or update tracking issue on failure
        if: steps.verify.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('verify_report.txt', 'utf8');
            const title = 'Live verification: broken entries';
            const body = [
              'Automated report from `.github/workflows/verify-live.yml`.',
              '',
              'Run: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              report.slice(0, 60000),
              '```',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'verify-live',
              per_page: 5,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['verify-live'],
              });
            }

      - name: Open per-slug agent issues for auto-fixable cases
        if: steps.verify.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('verify_report.txt', 'utf8');

            // Parse the report into per-entry blocks.
            const entries = [];
            let current = null;
            for (const line of report.split('\n')) {
              const header = line.match(/^\[(FAIL|WARN)\]\s+(.+?)\s+\(([^)]+)\)\s*$/);
              if (header) {
                if (current) entries.push(current);
                current = { status: header[1], name: header[2], slug: header[3], details: [] };
              } else if (current && /^\s+-\s/.test(line)) {
                current.details.push(line.replace(/^\s+-\s+/, ''));
              }
            }
            if (current) entries.push(current);

            // Classify: pick out only mechanically-fixable cases.
            const SUGGEST_RE = /SUGGEST:\s*(\S+)\s*\(HTTP 200\)/;
            const DEAD_RE = /(parked|hugedomains|Name or service not known|No address associated with hostname)/i;

            const actionable = [];
            for (const e of entries) {
              const detail = e.details.join(' | ');
              const sm = detail.match(SUGGEST_RE);
              if (sm) {
                actionable.push({ ...e, fix: 'url_swap', suggested: sm[1] });
              } else if (DEAD_RE.test(detail)) {
                actionable.push({ ...e, fix: 'remove' });
              }
            }

            // Split between two free-tier agents to lift the daily ceiling.
            // Jules free: 15 tasks/day. OpenHands free: 10 conversations/day.
            // First N -> Jules (jules label); next M -> OpenHands (fix-me label).
            // Each one routes to exactly one agent to prevent racing PRs.
            const JULES_CAP = 5;
            const OPENHANDS_CAP = 7;
            const candidates = actionable.slice(0, JULES_CAP + OPENHANDS_CAP);
            core.info(`Found ${actionable.length} auto-fixable entries; routing ${candidates.length} (Jules: up to ${JULES_CAP}, OpenHands: up to ${OPENHANDS_CAP}).`);

            // Idempotency: skip slugs that already have an open issue.
            const existingOpen = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existingTitles = new Set(existingOpen.map(i => i.title));

            for (let i = 0; i < candidates.length; i++) {
              const c = candidates[i];
              const title = `Fix: ${c.slug}`;
              if (existingTitles.has(title)) {
                core.info(`Skip ${c.slug} — already has an open issue.`);
                continue;
              }
              const agentLabel = i < JULES_CAP ? 'jules' : 'fix-me';
              const agentName = i < JULES_CAP ? 'Jules' : 'OpenHands';
              const detailBlock = '```\n' + c.details.join('\n') + '\n```';
              const body = c.fix === 'url_swap'
                ? [
                    `**${c.name}** (\`${c.slug}\`) — careers URL is broken. The verifier found a working replacement.`,
                    '',
                    '**Verifier output:**',
                    detailBlock,
                    '',
                    `**Fix:** update \`careers_url\` for slug \`${c.slug}\` in \`data/companies.yml\` to:`,
                    '',
                    `\`${c.suggested}\``,
                    '',
                    `Also update the matching line in \`docs/categories/*.md\` if the URL is shown there. Follow \`AGENTS.md\`. Confirm with \`python scripts/verify_live.py --only ${c.slug}\`.`,
                    '',
                    `_Routed to ${agentName}._`,
                  ].join('\n')
                : [
                    `**${c.name}** (\`${c.slug}\`) — domain is dead or parked. Remove the entry.`,
                    '',
                    '**Verifier output:**',
                    detailBlock,
                    '',
                    `**Fix:** remove the \`${c.slug}\` entry from \`data/companies.yml\`, the matching \`docs/categories/*.md\` file, and decrement the per-category count in \`README.md\`.`,
                    '',
                    'Follow `AGENTS.md`. Confirm with `python scripts/validate.py`.',
                    '',
                    `_Routed to ${agentName}._`,
                  ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [agentLabel, 'fix-entry'],
              });
              core.info(`Opened: ${title} -> ${agentName}`);
            }

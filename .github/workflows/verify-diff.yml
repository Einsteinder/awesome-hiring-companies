name: Verify diff

on:
  # Runs on every PR. The "Detect added or modified entries" step early-exits
  # with count=0 when companies.yml hasn't changed, so PRs that only touch
  # docs/CI/scripts complete in seconds. A path filter here would mark the
  # required check as "expected" forever on those PRs and block merge.
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Detect added or modified entries
        id: diff
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          git fetch origin "${BASE_REF}" --depth=1 || true

          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          import os

          def load(ref):
              try:
                  blob = subprocess.check_output(
                      ["git", "show", f"{ref}:data/companies.yml"],
                      text=True, stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  return {}
              data = yaml.safe_load(blob) or []
              return {c["slug"]: c for c in data if isinstance(c, dict) and "slug" in c}

          base = load(f"origin/{os.environ['BASE_REF']}")
          head = load("HEAD")
          added = []
          changed = []
          # Added
          for slug in head:
              if slug not in base:
                  added.append(slug)
                  changed.append(slug)
              else:
                  # Modified entries: compare normalized fields that affect
                  # verification (careers_url, ats, sources).
                  a, b = base[slug], head[slug]
                  if (a.get("careers_url") != b.get("careers_url")
                      or a.get("ats") != b.get("ats")
                      or a.get("sources") != b.get("sources")):
                      changed.append(slug)
          Path("/tmp/diff_slugs.txt").write_text(
              "".join(f"{s}\n" for s in sorted(set(changed))),
              encoding="utf-8",
          )
          Path("/tmp/added_slugs.txt").write_text(
              "".join(f"{s}\n" for s in sorted(set(added))),
              encoding="utf-8",
          )
          PY

          count=$(wc -l < /tmp/diff_slugs.txt | tr -d ' ')
          added_count=$(wc -l < /tmp/added_slugs.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "added_count=$added_count" >> "$GITHUB_OUTPUT"
          echo "Diff-affected entries: $count"
          echo "New entries: $added_count"
          if [[ "$count" -gt 0 ]]; then
            echo "----- Slugs to verify -----"
            cat /tmp/diff_slugs.txt
          fi
          if [[ "$added_count" -gt 0 ]]; then
            echo "----- New slugs requiring North America openings -----"
            cat /tmp/added_slugs.txt
          fi

          # Pass slugs as space-separated for --only
          if [[ "$count" -gt 0 ]]; then
            slugs=$(tr '\n' ' ' < /tmp/diff_slugs.txt | sed 's/ $//')
            echo "slugs<<EOF" >> "$GITHUB_OUTPUT"
            echo "$slugs"      >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
          fi
          if [[ "$added_count" -gt 0 ]]; then
            added_slugs=$(tr '\n' ' ' < /tmp/added_slugs.txt | sed 's/ $//')
            echo "added_slugs<<EOF" >> "$GITHUB_OUTPUT"
            echo "$added_slugs"      >> "$GITHUB_OUTPUT"
            echo "EOF"               >> "$GITHUB_OUTPUT"
          fi

      - name: Schema + uniqueness validate (always)
        run: python scripts/validate.py

      - name: Verify diff entries live
        if: steps.diff.outputs.count != '0'
        id: verify
        shell: bash {0}
        env:
          SLUGS: ${{ steps.diff.outputs.slugs }}
        run: |
          set +e
          # shellcheck disable=SC2086
          python scripts/verify_live.py \
            --only $SLUGS \
            --format text > /tmp/report.txt
          code=$?
          cat /tmp/report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Gate merge only on hard `fail` (exit 1); `warn` (exit 0 already)
          # means careers_url is bot-blocked but the ATS slug verifies — the
          # page works in a browser. Surface warns in the report, don't block.
          exit "$code"

      - name: Verify added entries have North America openings
        if: steps.diff.outputs.added_count != '0'
        id: verify_na
        shell: bash {0}
        env:
          ADDED_SLUGS: ${{ steps.diff.outputs.added_slugs }}
        run: |
          set +e
          # shellcheck disable=SC2086
          python scripts/verify_live.py \
            --only $ADDED_SLUGS \
            --require-north-america-openings \
            --fail-on-warn \
            --format text > /tmp/north-america-report.txt
          code=$?
          cat /tmp/north-america-report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Comment on PR with report
        if: always() && (steps.verify.outcome != 'skipped' || steps.verify_na.outcome != 'skipped')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('/tmp/report.txt')
              ? fs.readFileSync('/tmp/report.txt', 'utf8')
              : '(no report file)';
            const naReport = fs.existsSync('/tmp/north-america-report.txt')
              ? fs.readFileSync('/tmp/north-america-report.txt', 'utf8')
              : '';
            const failed = '${{ steps.verify.outcome }}' === 'failure'
              || '${{ steps.verify_na.outcome }}' === 'failure';
            const hasWarn = report.includes('[WARN]') || naReport.includes('[WARN]');
            // Only comment on real failures or when warns are present.
            if (!failed && !hasWarn) return;
            const header = failed
              ? '`verify-diff` flagged one or more new or modified entries.'
              : '`verify-diff` passed, but some entries are bot-blocked (warn). The pages work in a browser; the runner gets WAF-blocked.';
            const body = [
              header,
              '',
              '> `fail` blocks merge: the ATS slug does not resolve, the domain is dead, or a new entry has no verified North America opening.',
              '> `warn` does not block merge: careers_url is bot-blocked but the ATS slug verifies.',
              '> New company entries must also expose at least one North America opening.',
              '',
              'Live verification:',
              '```',
              report.slice(0, 60000),
              '```',
              ...(naReport ? [
                '',
                'North America opening check:',
                '```',
                naReport.slice(0, 60000),
                '```',
              ] : []),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

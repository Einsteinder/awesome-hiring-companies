name: Auto-assign Jules

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  issues: write

jobs:
  summon-jules:
    if: |
      contains(github.event.issue.labels.*.name, 'agent-task') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Comment @jules on the issue
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- jules-summoned -->';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (comments.data.some(c => c.body && c.body.includes(marker))) {
              core.info('Jules already summoned on this issue. Skipping.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${marker}\n@jules please address this issue. Follow the instructions in \`AGENTS.md\`. Open a draft PR with the changes.`,
            });
